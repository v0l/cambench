[package]
name = "cambench"
version = "0.1.0"
edition = "2024"
description = "CAM toolpaths from text: a .gcam file of one operation per line, G-code posts, and a stock-removal simulation that checks them"
license = "GPL-3.0-only"
repository = "https://github.com/v0l/cambench"

[workspace]

[[bin]]
name = "cambench"
path = "src/main.rs"

[[bin]]
name = "cambench-ui"
path = "src/bin/cambench-ui.rs"

[dependencies]
egui = "0.37"
egui_bench = "0.9.4"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "clipboard", "links", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3
